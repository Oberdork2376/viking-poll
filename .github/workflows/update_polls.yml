name: Auto-Update Viking Polls

on:
  schedule:
    # Runs automatically every day at 6:00 AM UTC (adjust or run manually anytime)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows you to trigger a manual update with 1 click anytime

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib numpy

      - name: Run poll generation script
        run: python generate_polls.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html viking_poll_dashboard.png
          git diff-index --quiet HEAD || git commit -m "Auto-updated polling dashboard"
          git push
